# =============================================================================
# Frappe / ERPNext v15 — Production Docker Compose
# nginx is intentionally excluded — host nginx proxies to this stack
# =============================================================================
#
# Container layout:
#
#   [Host nginx]  ←──── proxy_pass ────→  backend:8000  (exposed on host)
#                 ←── proxy_pass ws  ────→ socketio:9000 (exposed on host)
#
#   backend:8000  (Gunicorn)
#   socketio:9000 (Node.js Socket.IO)
#   worker_short  (short + default queue)
#   worker_long   (long + default queue)
#   scheduler     (bench schedule / cron)
#   redis_cache   (allkeys-lru, no persistence)
#   redis_queue   (noeviction, AOF persistence)
#   mariadb:3306  (internal only — NOT exposed to host)
#
# Startup order:
#   mariadb + redis_* → configurator (one-shot) → app containers
#
# Usage:
#   cp .env.example .env
#   docker compose build
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f backend
# =============================================================================

# ---------------------------------------------------------------------------
# YAML anchors
# ---------------------------------------------------------------------------

# Env vars shared across all Frappe app containers
x-frappe-env: &frappe-env
  DB_HOST: "${DB_HOST:-mariadb}"
  DB_PORT: "${DB_PORT:-3306}"
  REDIS_CACHE: "${REDIS_CACHE}"
  REDIS_QUEUE: "${REDIS_QUEUE}"
  REDIS_SOCKETIO: "${REDIS_SOCKETIO}"
  FRAPPE_SITE_NAME: "${FRAPPE_SITE_NAME}"
  FRAPPE_SITE_NAME_HEADER: "${FRAPPE_SITE_NAME_HEADER:-$$host}"

# Base definition shared by all Frappe app containers
x-frappe-app: &frappe-app
  image: ${CUSTOM_IMAGE:-frappe-erpnext-v15}:${IMAGE_TAG:-latest}
  user: frappe
  build:           
    context: .
    dockerfile: Dockerfile
  working_dir: /home/frappe/frappe-bench
  environment:
    <<: *frappe-env
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  networks:
    - frappe-net

# All app containers wait for configurator + infra healthy
x-app-depends: &app-depends
  depends_on:
    configurator:
      condition: service_completed_successfully
    mariadb:
      condition: service_healthy
    redis_cache:
      condition: service_healthy
    redis_queue:
      condition: service_healthy

# ---------------------------------------------------------------------------
services:

  # ---------------------------------------------------------------------------
  # configurator
  # Runs once at stack startup. Writes connection details into
  # common_site_config.json so all containers share the same config.
  # All app containers block on this completing successfully.
  # ---------------------------------------------------------------------------
  configurator:
    <<: *frappe-app
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        echo ">>> Writing apps.txt"
        ls -1 apps > sites/apps.txt

        echo ">>> Writing common_site_config.json"
        bench set-config -g db_host         "$DB_HOST"
        bench set-config -g db_port         "$DB_PORT"
        bench set-config -g redis_cache     "$REDIS_CACHE"
        bench set-config -g redis_queue     "$REDIS_QUEUE"
        bench set-config -g redis_socketio  "$REDIS_SOCKETIO"
        bench set-config -g socketio_port   9000
        bench set-config -g webserver_port  8000
        bench set-config -g maintenance_mode 0
        bench set-config -g serve_default_site 1

        echo ">>> Configurator done."
    depends_on:
      mariadb:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      redis_queue:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # backend
  # Gunicorn WSGI server serving all Frappe HTTP requests.
  # Exposed on host so your host nginx can proxy_pass to it.
  #
  # Tuning:
  #   GUNICORN_WORKERS = 2 × CPU cores  (start conservative, scale up)
  #   GUNICORN_THREADS = 4              (safe for Frappe's threading model)
  # ---------------------------------------------------------------------------
  backend:
    <<: [*frappe-app, *app-depends]
    restart: unless-stopped
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-2}
      - --worker-class=gthread
      - --threads=${GUNICORN_THREADS:-4}
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - --preload
      - frappe.app:application
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # ---------------------------------------------------------------------------
  # socketio
  # Node.js Socket.IO server for Frappe real-time features:
  #   - live document update notifications
  #   - form collaboration (multiple users on same doc)
  #   - background job progress indicators
  # Exposed on host so your host nginx can proxy WebSocket connections.
  # ---------------------------------------------------------------------------
  socketio:
    <<: [*frappe-app, *app-depends]
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    ports:
      - "127.0.0.1:${SOCKETIO_PORT:-9000}:9000"
    

  # ---------------------------------------------------------------------------
  # worker_short
  # RQ worker processing "short" and "default" queues.
  # Handles fast jobs: email dispatch, webhooks, quick notifications.
  # Timeout: 300s — jobs exceeding this are killed and requeued.
  # Scale up by adding more replicas if email/webhook backlog builds up.
  # ---------------------------------------------------------------------------
  worker_short:
    <<: [*frappe-app, *app-depends]
    restart: unless-stopped
    command: bench worker --queue short,default

  # ---------------------------------------------------------------------------
  # worker_long
  # RQ worker processing "long" and "default" queues.
  # Handles heavy jobs: report generation, bulk imports/exports, ledger posting.
  # Isolated from short queue — heavy jobs never block quick notifications.
  # Timeout: 1500s — increase if you have extremely large data imports.
  # ---------------------------------------------------------------------------
  worker_long:
    <<: [*frappe-app, *app-depends]
    restart: unless-stopped
    command: bench worker --queue long,default,short

  # ---------------------------------------------------------------------------
  # scheduler
  # Frappe beat scheduler — triggers all periodic/cron jobs:
  #   automated backups, scheduled reports, stock reorder checks,
  #   recurring invoices, ledger recalculations, etc.
  # ⚠ Never scale this service — only ONE instance must run at a time.
  # ---------------------------------------------------------------------------
  scheduler:
    <<: [*frappe-app, *app-depends]
    restart: unless-stopped
    command: bench schedule

  # ---------------------------------------------------------------------------
  # redis_cache
  # Dedicated Redis for Frappe's page and query cache.
  # Policy: allkeys-lru — evicts least-recently-used when memory is full.
  # No persistence — cache is always rebuildable from the DB.
  # Kept separate from redis_queue so cache pressure never evicts job data.
  # Not exposed to host — internal only.
  # ---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frappe-net

  # ---------------------------------------------------------------------------
  # redis_queue
  # Dedicated Redis for the RQ background job queue + Socket.IO pub/sub.
  # Policy: noeviction — never silently drops jobs, fails loudly instead.
  # Persistence: AOF everysec — in-progress jobs survive container restarts.
  # Not exposed to host — internal only.
  # ---------------------------------------------------------------------------
  redis_queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frappe-net

  # ---------------------------------------------------------------------------
  # mariadb
  # MariaDB 10.6 LTS — internal only, NOT exposed to host.
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER:-frappe}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${FRAPPE_SITE_NAME}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_file_per_table=1
      - --innodb_flush_method=O_DIRECT
      - --max_connections=300
      - --max_allowed_packet=512M
      - --tmp_table_size=64M
      - --max_heap_table_size=64M
      - --query_cache_type=0
      - --query_cache_size=0
    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${DB_ROOT_PASSWORD}
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - frappe-net

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  sites:
    name: ${VOLUME_SITES:-frappe_v15_sites}
  logs:
    name: ${VOLUME_LOGS:-frappe_v15_logs}
  mariadb_data:
    name: ${VOLUME_MARIADB:-frappe_v15_mariadb}
  redis_cache_data:
    name: ${VOLUME_REDIS_CACHE:-frappe_v15_redis_cache}
  redis_queue_data:
    name: ${VOLUME_REDIS_QUEUE:-frappe_v15_redis_queue}

# =============================================================================
# Network — isolated bridge; only backend and socketio are exposed to host
# =============================================================================
networks:
  frappe-net:
    name: ${NETWORK_NAME:-frappe-net}
    driver: bridge
