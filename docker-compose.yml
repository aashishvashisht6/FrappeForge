version: '3'

services:
  backend:
    image: frappe_custom:1.0
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets

  configurator:
    image: frappe_custom:1.0
    deploy:
      restart_policy:
        condition: none
    entrypoint: 
      - bash
      - -c
    command: 
      - >
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_CACHE";
        bench set-config -g redis_socketio "redis://$$REDIS_CACHE";
        bench build --force;
        cp -r apps/frappe/frappe/public/* /home/frappe/frappe-bench/sites/assets/frappe;
        cp -r apps/erpnext/erpnext/public/* /home/frappe/frappe-bench/sites/assets/erpnext;
        cp -r apps/property_tax/property_tax/public/* /home/frappe/frappe-bench/sites/assets/property_tax;

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets

  redis-cache:
    image: redis:6.2-alpine
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-cache-data:/data
  
  db:
    image: mariadb:10.6
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 1s
      retries: 15
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql
  
  nginx:
    image: frappe_custom:1.0
    depends_on:
      - backend
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - /usr/local/bin/nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: backend:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
    ports:
      - "80:8080"

volumes:
  db-data:
  sites:
  logs:
  assets:
  redis-cache-data:
