# =============================================================================
# Host nginx config for Frappe / ERPNext v15
# File: /etc/nginx/sites-available/frappe-erp
# Symlink: ln -s /etc/nginx/sites-available/frappe-erp /etc/nginx/sites-enabled/
#
# This config assumes:
#   - Frappe backend  is on 127.0.0.1:8000  (BACKEND_PORT in .env)
#   - Frappe socketio is on 127.0.0.1:9000  (SOCKETIO_PORT in .env)
#   - Your site name  is erp.mycompany.com  (change SERVER_NAME below)
#
# For SSL: run certbot --nginx -d erp.mycompany.com after enabling this file
# =============================================================================

upstream frappe_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream frappe_socketio {
    server 127.0.0.1:9000;
    keepalive 8;
}

server {
    listen 80;
    server_name erp.mycompany.com;   # ← change to your domain

    # Redirect HTTP to HTTPS (uncomment after SSL is set up)
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;
    client_body_timeout  60s;

    # ---------------------------------------------------------------------------
    # Socket.IO — WebSocket proxy (must come before the catch-all location /)
    # ---------------------------------------------------------------------------
   location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name ${FRAPPE_SITE_NAME_HEADER};  # ← change to your domain
		proxy_set_header Origin $proxy_x_forwarded_proto://${FRAPPE_SITE_NAME_HEADER};  # ← change to your domain
		proxy_set_header Host $host;

		proxy_pass http://socketio-server;
	}

    # ---------------------------------------------------------------------------
    # Static assets — served from the Docker named volume mount on host
    # Mount the frappe_v15_assets volume or use a bind mount path here.
    # Alternatively, let gunicorn serve them (simpler, slightly slower).
    # ---------------------------------------------------------------------------
    # location /assets {
    #     alias /path/to/frappe_v15_assets;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }

    # ---------------------------------------------------------------------------
    # All other requests → Gunicorn backend
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass             http://frappe_backend;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_read_timeout     120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
    }
}

